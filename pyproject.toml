[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demandcast"
version = "0.1.0"
description = "Retail demand forecasting on M5 with the MLOps around it: rolling-origin backtests, calibrated intervals, a gated MLflow registry, drift-triggered retraining and a monitored FastAPI service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "scipy>=1.10,<2",
    "pyarrow>=14",
    "lightgbm>=4.0,<5",
    "mlflow>=2.14,<4",
    "fastapi>=0.110,<1",
    "pydantic>=2.5,<3",
    "uvicorn>=0.29,<1",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27,<1"]

[project.scripts]
demandcast-backtest = "demandcast.backtest:main"
demandcast-replay = "demandcast.replay:main"
demandcast-train = "demandcast.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM105", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
